name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli
    
    - name: Build APK
      run: |
        mkdir -p dist
        cp *.* dist/ 2>/dev/null || true
        cd dist
        npx @bubblewrap/cli init --manifest manifest.json
        npx @bubblewrap/cli build
        ls -la
    
    - name: Find and Upload APK
      id: find_apk
      run: |
        apk_file=$(find . -name "*.apk" -type f | head -n 1)
        if [ -n "$apk_file" ]; then
          echo "found=true" >> $GITHUB_OUTPUT
          echo "apk_path=$apk_file" >> $GITHUB_OUTPUT
          echo "✅ APK найден: $apk_file"
        else
          echo "found=false" >> $GITHUB_OUTPUT
          echo "❌ APK не найден"
          find . -type f | head -n 20
        fi
    
    - name: Upload APK
      if: steps.find_apk.outputs.found == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: quarwatch-apk
        path: ${{ steps.find_apk.outputs.apk_path }}
    
    - name: Create Release
      if: steps.find_apk.outputs.found == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Quarwatch APK v${{ github.run_number }}
        files: ${{ steps.find_apk.outputs.apk_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Fallback - Create ZIP
      if: steps.find_apk.outputs.found == 'false'
      run: |
        zip -r quarwatch-source.zip *
    
    - name: Upload ZIP (fallback)
      if: steps.find_apk.outputs.found == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: quarwatch-source
        path: quarwatch-source.zip
