name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli
    
    - name: Build APK
      run: |
        mkdir -p dist
        cp *.* dist/ 2>/dev/null || true
        cd dist
        npx @bubblewrap/cli init --manifest manifest.json || echo "⚠️ init failed"
        npx @bubblewrap/cli build || echo "⚠️ build failed"
        ls -la
    
    - name: Create ZIP if APK not found
      run: |
        if [ ! -f "dist/*.apk" ]; then
          echo "APK не найден, создаём ZIP"
          zip -r quarwatch-source.zip *
        fi
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quarwatch-build
        path: |
          dist/*.apk
          quarwatch-source.zip
        if-no-files-found: warn
    
    - name: Create Release (always)
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Quarwatch v${{ github.run_number }}
        files: |
          dist/*.apk
          quarwatch-source.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
