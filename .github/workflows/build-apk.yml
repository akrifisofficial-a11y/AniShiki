name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
    
    - name: Install Bubblewrap
      run: npm install -g @bubblewrap/cli
    
    - name: Build APK
      run: |
        mkdir -p dist
        cp *.* dist/ 2>/dev/null || true
        cd dist
        npx @bubblewrap/cli init --manifest manifest.json
        npx @bubblewrap/cli build || echo "⚠️ Сборка APK не удалась"
        ls -la
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quarwatch-apk
        path: |
          dist/app-release-signed.apk
          dist/app-release-unsigned.apk
          **/*.apk
        if-no-files-found: warn
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.run_number }}
        name: Quarwatch v${{ github.run_number }}
        files: |
          dist/app-release-signed.apk
          dist/app-release-unsigned.apk
          **/*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
