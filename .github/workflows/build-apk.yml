name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install PWA Builder
      run: |
        npm install -g @pwabuilder/cli
        npm install -g pwabuilder
      continue-on-error: true
    
    - name: Prepare files
      run: |
        mkdir -p dist
        cp index.html dist/ 2>/dev/null || true
        cp style.css dist/ 2>/dev/null || true
        cp script.js dist/ 2>/dev/null || true
        cp manifest.json dist/ 2>/dev/null || true
        cp sw.js dist/ 2>/dev/null || true
        cp updates.json dist/ 2>/dev/null || true
        echo "✅ Файлы скопированы"
    
    - name: Build APK
      run: |
        cd dist
        npx pwabuilder package --platform android --path . --output . || true
        echo "✅ Сборка завершена"
    
    - name: Find and upload APK
      run: |
        echo "🔍 Ищем APK файлы..."
        find . -name "*.apk" -type f
        if [ -f "dist/*.apk" ]; then
          echo "✅ APK найден"
        else
          echo "⚠️ APK не найден, проверяем структуру"
          ls -la dist/
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: quarwatch-apk
        path: |
          **/*.apk
          dist/**/*.apk
          .pwa/**/*.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Quarwatch APK v${{ github.run_number }}
        files: |
          **/*.apk
          dist/**/*.apk
          .pwa/**/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
