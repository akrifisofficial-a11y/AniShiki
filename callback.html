<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация через Shikimori</title>
  <style>
    body {
      background: #0a0b0e;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 20px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 92, 231, 0.1);
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }
    .error {
      color: #ff6b6b;
    }
    .success {
      color: #4ecdc4;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="message" id="status">⏳ Обработка авторизации...</div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const statusEl = document.getElementById('status');

      if (!code) {
        statusEl.textContent = '❌ Код авторизации не получен';
        statusEl.className = 'message error';
        return;
      }

      console.log('✅ Получен код:', code);

      // Сохраняем код в localStorage и перенаправляем на главную
      localStorage.setItem('shikimori_auth_code', code);
      
      statusEl.textContent = '✅ Код получен! Перенаправление...';
      statusEl.className = 'message success';

      setTimeout(() => {
        window.location.href = '/';
      }, 1500);
    })();
  </script>
</body>
</html>
