<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация через Shikimori</title>
  <style>
    body {
      background: #0a0b0e;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      flex-direction: column;
      gap: 20px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(108, 92, 231, 0.1);
      border-top-color: #6c5ce7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .message {
      color: #888;
      font-size: 0.9rem;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }
    .error {
      color: #ff6b6b;
    }
    .success {
      color: #4ecdc4;
    }
    .progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      border-radius: 3px;
      animation: progress 2s ease-in-out forwards;
    }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="message" id="status">⏳ Подключение к Shikimori...</div>
  <div class="progress-bar"><div class="fill"></div></div>

  <script>
    (async function() {
      // ===== КОНФИГУРАЦИЯ =====
      const CLIENT_ID = '_7QqZ-kZdFcxAVNWVnO9NLPTec6QcLRRzKscR7Ex_kw';
      const CLIENT_SECRET = 'qlLNtimt90rKiFmoAf2iJPNS5pmZ3BPhv4w9ocQM4H4';
      const REDIRECT_URI = 'https://quarwatch.c6t.ru/oauth/callback.html';
      const TOKEN_URL = 'https://shikimori.one/oauth/token';
      const API_URL = 'https://shikimori.one/api';

      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const statusEl = document.getElementById('status');

      if (!code) {
        statusEl.textContent = '❌ Код авторизации не получен. Попробуйте снова.';
        statusEl.className = 'message error';
        return;
      }

      try {
        statusEl.textContent = '⏳ Обмен кода на токен...';

        // ===== СПОСОБ 1: Через бесплатный прокси (рекомендуется) =====
        const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
        
        const response = await fetch(CORS_PROXY + TOKEN_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            client_id: CLIENT_ID,
            client_secret: CLIENT_SECRET,
            code: code,
            grant_type: 'authorization_code',
            redirect_uri: REDIRECT_URI
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error_description || 'Ошибка получения токена');
        }

        const data = await response.json();
        const { access_token } = data;

        statusEl.textContent = '⏳ Получение данных пользователя...';

        // Получаем данные пользователя (без прокси, с токеном)
        const userResponse = await fetch(`${API_URL}/users/whoami`, {
          headers: {
            'Authorization': `Bearer ${access_token}`
          }
        });

        if (!userResponse.ok) {
          throw new Error('Ошибка получения данных пользователя');
        }

        const user = await userResponse.json();

        // Сохраняем токен и данные
        localStorage.setItem('shikimori_token', access_token);
        localStorage.setItem('shikimori_user', JSON.stringify(user));

        statusEl.textContent = '✅ Авторизация успешна! Перенаправление...';
        statusEl.className = 'message success';

        setTimeout(() => {
          window.location.href = '/';
        }, 1500);

      } catch (err) {
        console.error('❌ Ошибка:', err);
        statusEl.textContent = `❌ Ошибка: ${err.message}`;
        statusEl.className = 'message error';
      }
    })();
  </script>
</body>
</html>
