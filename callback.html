<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход через Shikimori</title>
  <style>
    body {
      background: #0a0e1a;
      color: #e0e5ff;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      margin: 0;
    }
    .loader {
      border: 4px solid #3a4060;
      border-top: 4px solid #b8a0d0;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #9aa3c0;
    }
    .error {
      color: #ff7a7a;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <p id="message">Обработка входа через Shikimori...</p>

  <script>
    (function() {
      const messageEl = document.getElementById('message');
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');

      if (!code) {
        messageEl.textContent = '❌ Ошибка: код авторизации не получен';
        messageEl.className = 'error';
        return;
      }

      console.log('✅ Получен код авторизации:', code);

      // =============================================
      // В РЕАЛЬНОМ ПРОЕКТЕ ЗДЕСЬ ДОЛЖЕН БЫТЬ ЗАПРОС К ВАШЕМУ БЭКЕНДУ,
      // КОТОРЫЙ ОБМЕНЯЕТ КОД НА ACCESS_TOKEN.
      // Пример:
      // fetch('https://ваш-сервер.ру/api/token', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ code })
      // })
      // .then(res => res.json())
      // .then(data => {
      //   localStorage.setItem('shikimori_token', data.access_token);
      //   localStorage.setItem('shikimori_user', JSON.stringify(data.user));
      //   window.location.href = 'index.html';
      // })
      // .catch(err => {
      //   messageEl.textContent = '❌ Ошибка обмена кода: ' + err.message;
      //   messageEl.className = 'error';
      // });
      // =============================================

      // ДЕМОНСТРАЦИОННАЯ ЗАГЛУШКА (только для тестирования интерфейса!)
      // ВНИМАНИЕ: НЕ ИСПОЛЬЗУЙТЕ В ПРОДАКШЕНЕ!
      const fakeToken = 'fake_token_' + Date.now();
      const fakeUser = { nickname: 'ТестовыйПользователь' };

      localStorage.setItem('shikimori_token', fakeToken);
      localStorage.setItem('shikimori_user', JSON.stringify(fakeUser));

      messageEl.textContent = '✅ Вход выполнен (демо-режим). Перенаправление...';
      
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    })();
  </script>
</body>
</html>
