<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📅 Календарь релизов — Quarwatch</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/calendar.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-left">
        <a href="index.html" class="logo-link">
          <div class="logo">🌙 Quarwatch</div>
        </a>
        <div class="subtitle">календарь</div>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <a href="index.html" class="back-btn">← На главную</a>
      </div>
    </div>
  </header>

  <main style="padding-top:110px;">
    <section class="active">
      <div class="calendar-header">
        <h2>📅 Календарь релизов</h2>
        <p class="calendar-subtitle">Что вышло за последние дни</p>
      </div>

      <!-- Легенда -->
      <div class="calendar-legend">
        <span class="legend-item"><span class="translation-badge legend-voice">🎙️ Озвучка</span> — голосовой перевод</span>
        <span class="legend-item"><span class="translation-badge legend-subs">📝 Субтитры</span> — текстовый перевод</span>
        <span class="legend-item"><span class="time-badge">🕐 14:30</span> — время выхода</span>
      </div>

      <!-- Кнопки дней -->
      <div id="days-nav" class="days-nav"></div>

      <!-- Список релизов -->
      <div id="calendar-content" class="calendar-content">
        <div class="loader">Загрузка релизов...</div>
      </div>
    </section>
  </main>

  <footer id="site-footer">
    <p>© <span id="current-year">2026</span> Quarwatch <span>|</span> Создатель: <span>quartess</span></p>
    <p class="footer-sub">🌙 Сделано с любовью к аниме</p>
  </footer>

  <script src="js/calendar.js"></script>
</body>
</html>
