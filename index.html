<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarwatch – смотреть онлайн</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ЛОГОТИП-ИЗОБРАЖЕНИЕ -->
  <div class="site-logo-img">
    <img src="logo.png" alt="Quarwatch" class="logo-image" />
    <span class="logo-name">Quarwatch</span>
  </div>

  <header>
    <div class="header-top">
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <a href="#" id="logo-link" class="logo-link">
        <div class="logo">🌙 Quarwatch</div>
      </a>
      <div class="subtitle">смотреть онлайн</div>
    </div>

    <nav class="nav-menu" id="nav-menu">
      <ul>
        <li><a href="#" id="menu-developer">👨‍💻 Разработчик</a></li>
        <li><a href="#" id="menu-updates">🔄 Обновления</a></li>
      </ul>
    </nav>

    <nav class="categories">
      <button class="category-btn active" data-type="series">📺 Сериалы</button>
      <button class="category-btn" data-type="movie">🎬 Фильмы</button>
      <button class="category-btn" data-type="important">❓ Важно</button>
    </nav>
  </header>

  <main>
    <!-- Каталог -->
    <section id="anime-list" class="active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Поиск..." />
        <button id="search-btn">🔍</button>
      </div>
      <div id="catalog" class="catalog-grid"></div>
      <button id="load-more-btn" class="back-btn" style="display:none; margin: 20px auto; width: fit-content;">📥 Загрузить ещё</button>
      <div id="loader" class="loader">Загрузка...</div>
    </section>

    <!-- Плеер -->
    <section id="player-section">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <button id="back-btn" class="back-btn">← Назад</button>
        <button id="share-btn" class="back-btn">🔗 Поделиться</button>
      </div>
      <div id="anime-info" class="anime-info"></div>
      <div id="player-container" style="margin-top: 25px; position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,0.5);">
        <iframe id="player-iframe" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
    </section>

    <!-- Страница обновлений -->
    <section id="updates-section">
      <button id="updates-back-btn" class="back-btn">← Назад</button>
      <div id="updates-content" class="updates-content">
        <div class="loader">Загрузка обновлений...</div>
      </div>
    </section>
  </main>

  <!-- Модальное окно -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Увеличенное изображение -->
  <div id="modal-image-overlay" class="modal-image-overlay">
    <button class="close-btn" id="modal-image-close">✕</button>
    <img id="modal-image" src="" alt="Увеличенное изображение" />
  </div>

  <!-- Футер -->
  <footer id="site-footer">
    <p>
      © <span id="current-year">2026</span> Quarwatch
      <span>|</span>
      Создатель: <span>quartess</span>
    </p>
    <p class="footer-sub">
      🌙 Сделано с любовью к аниме
    </p>
  </footer>

  <script src="script.js"></script>
</body>
                </html>
