<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quarwatch – смотреть аниме онлайн</title>
  
  <!-- SEO -->
  <meta name="description" content="Quarwatch – смотри аниме онлайн бесплатно. Большой каталог аниме сериалов и фильмов." />
  <meta name="keywords" content="аниме, смотреть аниме, аниме онлайн, Quarwatch" />
  <link rel="canonical" href="https://quarwatch.c6t.ru/" />
  <meta name="robots" content="index, follow" />
  
  <!-- Open Graph -->
  <meta property="og:title" content="Quarwatch – смотреть аниме онлайн" />
  <meta property="og:description" content="Смотри аниме онлайн бесплатно. Большой каталог аниме сериалов и фильмов." />
  <meta property="og:url" content="https://quarwatch.c6t.ru/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Quarwatch" />
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <div class="header-left">
        <a href="#" id="logo-link" class="logo-link">
          <div class="logo">🌙 Quarwatch</div>
        </a>
        <div class="subtitle">смотреть онлайн</div>
      </div>
      <div class="header-right">
        <!-- Авторизация -->
        <div class="auth-section">
          <button id="login-btn" class="auth-btn">Войти через Shikimori</button>
          <span id="user-info" style="display:none; color:#888; cursor:pointer;"></span>
        </div>
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <nav class="nav-menu" id="nav-menu">
      <ul>
        <li><a href="#" id="menu-developer">👨‍💻 Разработчик</a></li>
        <li><a href="#" id="menu-updates">🔄 Обновления</a></li>
      </ul>
    </nav>

    <nav class="categories">
      <button class="category-btn active" data-type="series">📺 Сериалы</button>
      <button class="category-btn" data-type="movie">🎬 Фильмы</button>
      <button class="category-btn" data-type="important">❓ Важно</button>
    </nav>
  </header>

  <main>
    <!-- Каталог -->
    <section id="anime-list" class="active">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Поиск..." />
        <button id="search-btn">🔍</button>
      </div>
      <div id="catalog" class="catalog-grid"></div>
      <button id="load-more-btn" class="back-btn" style="display:none; margin: 20px auto; width: fit-content;">📥 Загрузить ещё</button>
      <div id="loader" class="loader">Загрузка...</div>
    </section>

    <!-- Плеер -->
    <section id="player-section">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <button id="back-btn" class="back-btn">← Назад</button>
        <button id="share-btn" class="back-btn">🔗 Поделиться</button>
      </div>
      <div id="anime-info" class="anime-info"></div>
      <div id="player-container">
        <iframe id="player-iframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
    </section>

    <!-- Страница обновлений -->
    <section id="updates-section">
      <button id="updates-back-btn" class="back-btn">← Назад</button>
      <div id="updates-content" class="updates-content">
        <div class="loader">Загрузка обновлений...</div>
      </div>
    </section>
  </main>

  <!-- Модальное окно -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Увеличенное изображение -->
  <div id="modal-image-overlay" class="modal-image-overlay">
    <button class="close-btn" id="modal-image-close">✕</button>
    <img id="modal-image" src="" alt="Увеличенное изображение" />
  </div>

  <!-- Футер -->
  <footer id="site-footer">
    <p>
      © <span id="current-year">2026</span> Quarwatch
      <span>|</span>
      Создатель: <span>quartess</span>
    </p>
    <p class="footer-sub">
      🌙 Сделано с любовью к аниме
    </p>
  </footer>

  <script src="script.js"></script>
</body>
  </html>
