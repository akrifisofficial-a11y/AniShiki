<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Quarwatch – смотреть аниме онлайн</title>
  
  <meta name="robots" content="index, follow" />
  <meta name="description" content="Quarwatch – смотри аниме онлайн бесплатно." />
  <meta name="theme-color" content="#6c5ce7" />
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ШАПКА -->
  <header>
    <div class="header-top">
      <div class="header-left">
        <a href="home.html" class="logo-link">
          <div class="logo">🌙 Quarwatch</div>
        </a>
      </div>
      <div class="header-right">
        <button id="search-toggle" class="header-icon-btn" aria-label="Поиск">🔍</button>
        <div class="hamburger" id="hamburger">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <!-- Поиск (скрыт) -->
    <div class="search-bar hidden" id="search-bar">
      <input type="text" id="search-input" placeholder="Поиск аниме..." />
      <button id="search-btn">🔍</button>
    </div>

    <!-- ГАМБУРГЕР-МЕНЮ -->
    <nav class="nav-menu" id="nav-menu">
      <ul>
        <li><a href="calendar.html">📅 Календарь</a></li>
        <li><a href="anilist.html">🕒 Анонсы</a></li>
        <li><a href="profile.html">👤 Профиль</a></li>
        <li><a href="auth.html">🔐 Войти</a></li>
        <li><a href="developer.html">👨‍💻 Разработчик</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="anime-list" class="active">
      <div id="catalog" class="catalog-grid"></div>
      <button id="load-more-btn" class="back-btn" style="display:none; margin: 20px auto; width: fit-content;">📥 Загрузить ещё</button>
      <div id="loader" class="loader">Загрузка...</div>
    </section>

    <section id="player-section">
      <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center;">
        <button id="back-btn" class="back-btn">← Назад</button>
        <button id="share-btn" class="back-btn">🔗 Поделиться</button>
      </div>
      <div id="anime-info" class="anime-info"></div>
      <div id="player-container">
        <iframe id="player-iframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
    </section>
  </main>

  <!-- НИЖНЯЯ НАВИГАЦИЯ -->
  <nav class="bottom-nav">
    <a href="home.html" class="bottom-nav-item" style="text-decoration:none;">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Главная</span>
    </a>
    <button class="bottom-nav-item active" data-type="series">
      <span class="nav-icon">📺</span>
      <span class="nav-label">Сериалы</span>
    </button>
    <button class="bottom-nav-item" data-type="movie">
      <span class="nav-icon">🎬</span>
      <span class="nav-label">Фильмы</span>
    </button>
    <a href="profile.html" class="bottom-nav-item" style="text-decoration:none;">
      <span class="nav-icon">👤</span>
      <span class="nav-label">Профиль</span>
    </a>
  </nav>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="modal-image-overlay" class="modal-image-overlay">
    <button class="close-btn" id="modal-image-close">✕</button>
    <img id="modal-image" src="" alt="" />
  </div>

  <script src="js/script.js"></script>
</body>
</html>
